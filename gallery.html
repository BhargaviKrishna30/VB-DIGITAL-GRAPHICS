<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#111;
  color:white;
}

/* NAVBAR */

header{
  width:100%;
  padding:25px 8%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#000000c4;
  position:sticky;
  top:0;
  z-index:1000;
  position:relative;
}

.logo{
  font-size:30px;
  font-weight:700;
  color:#d4a24c;
}

nav{
  display:flex;
  gap:30px;
}

nav a{
  text-decoration:none;
  color:#d4a24c;
  font-size:17px;
}

nav a:hover{
  color:white;
}

/* MOBILE MENU */

.menu-toggle{
  display:none;
  font-size:30px;
  color:#d4a24c;
  cursor:pointer;
}

/* GALLERY */

.gallery{
  padding:80px 8%;
  text-align:center;
}

.gallery-title{
  width:fit-content;
  margin:0 auto 70px;
  font-size:52px;
  color:#d4a24c;
  padding:18px 45px;
  background:rgba(36,24,20,0.85);
  border:1px solid rgba(212,162,76,0.25);
  backdrop-filter:blur(10px);
  border-radius:22px;
  box-shadow:0 8px 25px rgba(0,0,0,0.35);
}

.gallery-section{
  margin-bottom:70px;
}

.gallery-section h2{
  font-size:36px;
  margin-bottom:30px;
  color:white;
  border-left:4px solid #d4a24c;
  text-align:start;
  padding-left:15px;
}

.gallery-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:40px;
}

.gallery-card{
  background:#241814;
  border:1px solid #5a3b2f;
  border-radius:24px;
  overflow:hidden;
  transition:0.4s;
}

.gallery-card:hover{
  transform:translateY(-8px);
}

.gallery-card img{
  width:100%;
  height:480px;
  object-fit:cover;
  object-position:center;
  display:block;
}

footer{
  background:#111;
  text-align:center;
  padding:10px;
  color:#999;
}

/* MOBILE */

@media(max-width:768px){

  header{
    padding:20px 5%;
  }

  .logo{
    font-size:18px;
  }

  .menu-toggle{
    display:block;
  }

  nav{
    display:none;
  }

  nav.show{
    display:flex;
    flex-direction:column;

    position:absolute;

    top:75px;
    right:20px;

    background:#241814;

    padding:15px 22px;

    border-radius:12px;

    gap:15px;

    z-index:1000;
  }

  .gallery{
    padding:40px 5%;
  }

  .gallery-title{
    font-size:32px;
    padding:12px 25px;
    margin-bottom:45px;
  }

  .gallery-section h2{
    font-size:26px;
  }

  .gallery-grid{
    grid-template-columns:1fr;
    gap:25px;
  }

  .gallery-card img{
    height:auto;
  }

}

</style>
</head>
